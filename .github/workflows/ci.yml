name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and coverage tests
        run: pnpm test:coverage

      - name: Build production bundle
        run: pnpm build

      - name: Install Chromium for browser tests
        if: hashFiles('e2e/**/*.spec.ts', 'e2e/**/*.test.ts', 'e2e/**/*.spec.tsx', 'e2e/**/*.test.tsx') != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        if: hashFiles('e2e/**/*.spec.ts', 'e2e/**/*.test.ts', 'e2e/**/*.spec.tsx', 'e2e/**/*.test.tsx') != ''
        run: pnpm test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
